name: CI

on:
  push:
    # dev no longer requires a PR to update (feature branches merge directly
    # into dev, PR-gated only into main) — CI must still run on direct
    # pushes/merges to dev, not just on PRs, or dev would go unverified.
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests
        # Vitest arrives with the export-suite feature; skip gracefully until
        # a test script exists so CI is green on the current codebase too.
        run: |
          if npm run | grep -q "^  test$"; then
            npm test
          else
            echo "No test script yet — skipping (added by 001-export-suite)"
          fi
